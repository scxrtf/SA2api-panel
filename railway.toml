# Railway 部署配置（Next.js 全栈 + Prisma Postgres db.prisma.io）。
# 变量（需在 Railway 服务 Variables 里手动设置）：
#   DATABASE_URL  — Prisma Postgres 直连串（db.prisma.io:5432，sslmode=require）
#   DIRECT_URL    — 同 DATABASE_URL（迁移与查询共用一条直连）
#   WB2A_API_KEY  — 面板主密钥（公网必须设置；面板 / /api/v1/* / cron 都靠它鉴权）

[build]
# 用仓库自带 Dockerfile，避免 Nixpacks 在缓存的 node_modules 上执行
# `npm ci` 触发 EBUSY（rmdir /app/node_modules/.cache），同时保证构建期
# 一定装上 devDependencies（prisma/typescript/tailwind）。
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 启动前先幂等执行迁移（走 DIRECT_URL；Prisma Postgres 直连，无 pooler 分流需求）。
startCommand = "if [ \"$USE_CLOUDBASE_REST\" != \"1\" ]; then npx prisma migrate deploy || exit 1; fi; exec npm run start"
healthcheckPath = "/api/livez"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# 单容器语义：选号运行态（inFlight/lastUsed）是进程内 Map，不要水平扩多副本。
