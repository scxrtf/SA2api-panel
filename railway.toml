# Railway 部署声明（https://railway.app）。
# 平台注入 PORT 环境变量，网关 applyEnv 已识别（优先级低于 WB2A_LISTEN）。
# 必需环境变量：WB2A_API_KEY（或 WB2A_API_KEYS 多 key JSON）。
# 可选：WB2A_PROVIDERS（聚合供应商 JSON 数组）、UPSTASH_REDIS_REST_URL/TOKEN
# （无持久卷时以 Upstash 替代本地 state 文件）。
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
