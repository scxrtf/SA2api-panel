# Railway 部署配置（Next.js 全栈 + 外部 Supabase Postgres）。
# 变量（都需在 Railway 服务 Variables 里手动设置，Supabase 不会自动注入）：
#   DATABASE_URL  — Supabase transaction pooler 连接串（6543，带 pgbouncer=true）
#   DIRECT_URL    — Supabase session pooler 连接串（5432，迁移用）
#   WB2A_API_KEY  — 面板主密钥（公网必须设置；面板 / /api/v1/* / cron 都靠它鉴权）

[build]
# 用仓库自带 Dockerfile，避免 Nixpacks 在缓存的 node_modules 上执行
# `npm ci` 触发 EBUSY（rmdir /app/node_modules/.cache），同时保证构建期
# 一定装上 devDependencies（prisma/typescript/tailwind）。
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 启动前先幂等执行迁移（走 DIRECT_URL session pooler；pgbouncer 事务模式不支持
# migrate 的会话级特性，由 schema.prisma 的 directUrl 分流保证）。
startCommand = "npx prisma migrate deploy && npm run start"
healthcheckPath = "/api/livez"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# 单容器语义：选号运行态（inFlight/lastUsed）是进程内 Map，不要水平扩多副本。
